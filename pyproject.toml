[project]
name = "prism-platform"
version = "0.1.0"
description = "PRISM - Light goes in, intelligence comes out. AI-powered account intelligence with evidence-graded research."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "temporalio>=1.9",
    "instructor>=1.7",
    "anthropic>=0.43",
    "google-genai>=1.0",
    "httpx>=0.28",
    "tenacity>=9.0",
    "structlog>=24.0",
    "yfinance>=0.2",
    "playwright>=1.49",
    "scout",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# LLM prompt templates have long lines by nature
"prism_platform/modules/*/collector.py" = ["E501"]
"prism_platform/modules/*/enricher.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "browser: tests requiring a real Playwright browser (deselect with -m 'not browser')",
]

[tool.uv.sources]
scout = { path = "../Scout", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
]
