<header class="hero-kelly" id="opportunity">
  <span class="eyebrow on-dark">Personalized, AI-driven search and discovery for</span>
  <h1>{{meta.company}}</h1>
  <p class="sub">{{hero.sub}}</p>
  {{#if hero.primary_cta_label}}
  <div class="hero-ctas">
    <a class="btn btn-primary" style="background:#fff;color:var(--color-primary)" href="{{hero.primary_cta_href}}">{{hero.primary_cta_label}}</a>
  </div>
  {{/if}}
</header>
