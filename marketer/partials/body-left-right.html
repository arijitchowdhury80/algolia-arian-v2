<section id="findings" class="bg-tint">
  <div class="section-head">
    <span class="eyebrow">{{eyebrow}}</span>
    <h2>{{heading}}</h2>
    <p>{{subheading}}</p>
  </div>

  {{#each items}}
  <div class="finding-row{{#if reverse}} reverse{{/if}}">
    <div class="finding-visual">
      {{#if visual_line1}}{{visual_line1}}<br>{{visual_line2}}{{else}}{{tag}}{{/if}}
    </div>
    <div class="finding-copy">
      {{#if tag}}<span class="finding-tag">{{tag}}</span>{{/if}}
      <h3>{{title}}</h3>
      <p>{{body}}</p>
    </div>
  </div>
  {{/each}}
</section>
