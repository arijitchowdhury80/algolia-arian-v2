<section>
  <div class="section-head">
    <span class="eyebrow">{{eyebrow}}</span>
    <h2>{{heading}}</h2>
    <p>{{subheading}}</p>
  </div>
  <div class="accordion">
    {{#each items}}
    <details>
      <summary>{{title}}</summary>
      <p>{{body}}</p>
    </details>
    {{/each}}
  </div>
</section>
