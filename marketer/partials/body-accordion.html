<section>
  <div class="section-head">
    <span class="eyebrow">{{findings.eyebrow}}</span>
    <h2>{{findings.heading}}</h2>
    <p>{{findings.subheading}}</p>
  </div>
  <div class="accordion">
    {{#each findings.items}}
    <details>
      <summary>{{title}}</summary>
      <p>{{body}}</p>
    </details>
    {{/each}}
  </div>
</section>
