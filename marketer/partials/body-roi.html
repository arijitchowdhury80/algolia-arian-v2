<section>
  <div class="section-head">
    <span class="eyebrow">{{roi.eyebrow}}</span>
    <h2>{{roi.heading}}</h2>
    <p>{{roi.subheading}}</p>
  </div>
  <div class="roi-grid">
    {{#each roi.cards}}
    <div class="roi-card {{tier}}{{#if is_placeholder}} placeholder{{/if}}">
      {{#if badge}}<span class="badge">{{badge}}</span>{{/if}}
      <div class="label">{{label}}</div>
      <div class="amount">{{amount}}</div>
      <div class="desc">{{desc}}</div>
    </div>
    {{/each}}
  </div>
  <p class="roi-note">{{roi.note}}</p>
</section>
