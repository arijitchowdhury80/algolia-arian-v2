<section id="proof" class="bg-tint">
  <div class="section-head">
    <span class="eyebrow">{{proof.eyebrow}}</span>
    <h2>{{proof.heading}}</h2>
    <p>{{proof.subheading}}</p>
  </div>
  <div class="proof-grid">
    {{#each proof.cards}}
    <div class="proof-card">
      <div class="company">{{company}}</div>
      <div class="vertical">{{vertical}}</div>
      <div class="metric">{{metric}}</div>
      <div class="result">{{result}}</div>
      <div class="relevance">{{relevance}}</div>
      <a class="case-link" href="{{link_href}}" target="_blank" rel="noopener">{{link_label}} &rarr;</a>
    </div>
    {{/each}}
  </div>
</section>
